name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Capacitor Android tools
        run: |
          npm ci
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web bundle
        run: npm run build

      - name: Initialize Android project & inject native Home Screen Widget
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node android-widget/patch-android.mjs
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GheimatAlan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
